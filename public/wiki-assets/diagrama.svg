<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbf9f4"/>
      <stop offset="100%" stop-color="#f0ebe0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdfcf9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3d2a1d" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="400" y="55" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="24" font-weight="600" fill="#2d2218">Arquitetura Integrada do Verso</text>
  <text x="400" y="80" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" fill="#75675b">Texto puro local com indexação SQLite e interface reativa</text>

  <!-- Node 1: Arquivos Locais -->
  <g transform="translate(60, 130)" filter="url(#shadow)">
    <rect width="200" height="180" rx="8" fill="url(#cardGrad)" stroke="#decbb8" stroke-width="1.5"/>
    <rect width="200" height="36" rx="8" fill="#bc5a45" fill-opacity="0.12"/>
    <text x="100" y="24" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#943722">Arquivos Locais</text>
    <text x="25" y="65" font-family="-apple-system, sans-serif" font-size="12" fill="#44372c">• Notas Markdown (.md)</text>
    <text x="25" y="95" font-family="-apple-system, sans-serif" font-size="12" fill="#44372c">• Bases estruturadas (.base)</text>
    <text x="25" y="125" font-family="-apple-system, sans-serif" font-size="12" fill="#44372c">• Anexos e mídias (PDF, SVG)</text>
    <text x="25" y="155" font-family="-apple-system, sans-serif" font-size="12" fill="#44372c">• Confinamento rigoroso</text>
  </g>

  <!-- Node 2: Núcleo Rust -->
  <g transform="translate(300, 130)" filter="url(#shadow)">
    <rect width="200" height="180" rx="8" fill="url(#cardGrad)" stroke="#decbb8" stroke-width="1.5"/>
    <rect width="200" height="36" rx="8" fill="#a0722a" fill-opacity="0.15"/>
    <text x="100" y="24" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#6d4910">Núcleo Rust</text>
    <text x="25" y="65" font-family="-apple-system, sans-serif" font-size="12" fill="#44372c">• Indexação SQLite FTS5</text>
    <text x="25" y="95" font-family="-apple-system, sans-serif" font-size="12" fill="#44372c">• Escrita atômica segura</text>
    <text x="25" y="125" font-family="-apple-system, sans-serif" font-size="12" fill="#44372c">• Watcher de arquivos</text>
    <text x="25" y="155" font-family="-apple-system, sans-serif" font-size="12" fill="#44372c">• Servidor MCP integrado</text>
  </g>

  <!-- Node 3: Interface Web / Tauri -->
  <g transform="translate(540, 130)" filter="url(#shadow)">
    <rect width="200" height="180" rx="8" fill="url(#cardGrad)" stroke="#decbb8" stroke-width="1.5"/>
    <rect width="200" height="36" rx="8" fill="#2d6d60" fill-opacity="0.12"/>
    <text x="100" y="24" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#1b4b42">Interface Verso</text>
    <text x="25" y="65" font-family="-apple-system, sans-serif" font-size="12" fill="#44372c">• Live Preview (CodeMirror)</text>
    <text x="25" y="95" font-family="-apple-system, sans-serif" font-size="12" fill="#44372c">• Bases vivas e interativas</text>
    <text x="25" y="125" font-family="-apple-system, sans-serif" font-size="12" fill="#44372c">• Grafo 2D acelerado</text>
    <text x="25" y="155" font-family="-apple-system, sans-serif" font-size="12" fill="#44372c">• Leitor PDF Spread Mode</text>
  </g>

  <!-- Arrows -->
  <path d="M 265 220 L 295 220" stroke="#943722" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow1)"/>
  <path d="M 505 220 L 535 220" stroke="#6d4910" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Bottom note -->
  <rect x="150" y="360" width="500" height="50" rx="25" fill="#ffffff" stroke="#e0d6c8" stroke-width="1"/>
  <text x="400" y="391" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#6d5c4e">Zero telemetria • Sem nuvem obrigatória • Seus dados pertencem a você</text>
</svg>
